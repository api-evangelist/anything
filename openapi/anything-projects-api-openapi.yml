      summary: Unpublish project
      description: Removes the published app for a project group without deleting the project group itself.
      tags:
      - Projects
      security:
      - basicAuth: []
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: projectGroupId
        in: path
      responses:
        '200':
          description: Project unpublished
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  projectGroupId:
                    type: string
                    format: uuid
                required:
                - success
                - projectGroupId
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
