  /v0/api/projects/{projectGroupId}/publish:
    post:
      summary: Publish project
      description: Publishes the project, making it publicly accessible. Optionally claims a custom slug.
      tags:
      - Projects
      security:
      - basicAuth: []
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: projectGroupId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
      responses:
        '200':
          description: Project published
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  projectGroupId:
                    type: string
                    format: uuid
                  slug:
                    type:
                    - string
                    - 'null'
                  deploymentId:
