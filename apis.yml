aid: anything
name: Anything
description: 'Anything is an AI-powered app builder that turns natural-language prompts
  into working web and mobile applications, complete with a built-in PostgreSQL database,
  authentication, backend functions, custom domains, and 100+ third-party integrations.
  Its public REST API (v0) lets agents and developers programmatically create projects,
  request AI-generated changes, provision databases, manage secrets and domains, publish
  web apps, and submit mobile apps to the App Store and Play Store. Backed by Bessemer
  Venture Partners and Uncork Capital.'
